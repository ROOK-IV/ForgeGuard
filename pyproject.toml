[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeguard"
version = "0.1.0"
description = "A read-only Docker security posture auditor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ROOK IV", email = "rookiv@proton.me" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3"
]

[project.scripts]
forgeguard = "forgeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
